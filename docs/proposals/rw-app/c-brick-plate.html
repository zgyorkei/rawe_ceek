<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rawe_ceek design C</title><style>
/* Page shell: layout only. A direction sets the --pg-* variables and may restyle anything under .pg. The app itself (.rw) is styled completely by the direction. */
:root { --pg-bg: #14161a; --pg-fg: #e9eaee; --pg-mut: #9aa0ac; --pg-card: #1d2026; --pg-line: #343943; --pg-acc: #e10600; --pg-font: system-ui, "Segoe UI", sans-serif; --pg-head: var(--pg-font); --pg-r: 10px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--pg-bg); color: var(--pg-fg); font: 15px/1.5 var(--pg-font); }
.pg { max-width: 1560px; margin: 0 auto; padding: 22px 22px 60px; }
.pg a { color: var(--pg-acc); }
.pg-h { display: flex; flex-wrap: wrap; gap: 14px 30px; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.pg-k { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--pg-mut); }
.pg-h h1 { margin: 2px 0 4px; font: 700 34px/1.1 var(--pg-head); }
.pg-t { margin: 0; max-width: 70ch; color: var(--pg-mut); }
.pg-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.pg-nav a { padding: 6px 12px; border: 1px solid var(--pg-line); border-radius: 99px; color: var(--pg-fg); text-decoration: none; font-size: 13px; }
.pg-nav a.on { background: var(--pg-fg); color: var(--pg-bg); }
.pg-c { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; margin: 10px 0 16px; padding: 10px 12px; border: 1px solid var(--pg-line); border-radius: var(--pg-r); background: var(--pg-card); }
.pg-cg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pg-cg > span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--pg-mut); margin-right: 4px; }
.pg-cg button, .pg-act button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--pg-line); background: transparent; color: var(--pg-fg); cursor: pointer; }
.pg-cg button.on, .pg-act button { background: var(--pg-fg); color: var(--pg-bg); border-color: var(--pg-fg); }
.pg-n { margin: 0; flex-basis: 100%; font-size: 12.5px; color: var(--pg-mut); }
.pg-frames { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; }
.fw { margin: 0; }
.fw figcaption { margin: 0 0 6px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--pg-mut); }
.fw.pc { flex: 1 1 880px; min-width: 880px; }
.fw.phone { flex: 0 0 392px; width: 392px; }
.frame { position: relative; height: 800px; overflow: hidden; border: 1px solid var(--pg-line); border-radius: 12px; }
.fw.phone .frame { border: 7px solid #000; border-radius: 38px; box-shadow: 0 0 0 1px var(--pg-line); }
.rw { position: absolute; inset: 0; overflow: hidden; }
.pg[data-dev="pc"] .fw.phone, .pg[data-dev="phone"] .fw.pc { display: none; }
.pg-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; margin: 26px 0; }
.pg-info h2, .pg-q h2 { font: 700 20px/1.2 var(--pg-head); margin: 0 0 8px; }
.pg-info ul { margin: 0; padding-left: 18px; } .pg-info li { margin: 4px 0; }
.pg-q { max-width: 920px; margin-top: 30px; }
.q { margin: 14px 0; padding: 14px 16px; border: 1px solid var(--pg-line); border-radius: var(--pg-r); background: var(--pg-card); }
.q h3 { margin: 0 0 8px; font: 600 15.5px/1.4 var(--pg-font); }
.q h3 span { display: inline-block; min-width: 38px; margin-right: 8px; padding: 1px 8px; border-radius: 99px; background: var(--pg-fg); color: var(--pg-bg); font-size: 12px; text-align: center; }
.q .opts { display: grid; gap: 4px; margin-bottom: 8px; }
.q .opts label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.q .cm { display: block; } .q .cm span { display: block; font-size: 12px; color: var(--pg-mut); margin-bottom: 2px; }
.q textarea { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--pg-line); background: var(--pg-bg); color: var(--pg-fg); resize: vertical; }
.pg-act { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0; }
.pg-act button { padding: 9px 18px; font-weight: 600; font-size: 14px; }
.pg details { margin: 6px 0; } .pg pre { white-space: pre-wrap; font: 12.5px/1.45 ui-monospace, Consolas, monospace; background: var(--pg-card); padding: 12px; border-radius: 8px; border: 1px solid var(--pg-line); }
.pg-f { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--pg-line); font-size: 12.5px; color: var(--pg-mut); max-width: 100ch; }

/* Direction C "Brick plate": a toy-brick world. Light blue-grey baseplate with studs, chunky tiles with a darker bottom edge, primary colours, rounded type.
   Layout switches only on .rw[data-mode]. Studs are pseudo-elements. */

/* ---------- page shell ---------- */
:root { --pg-bg: #cddbe6; --pg-fg: #1b2330; --pg-mut: #4a5a6e; --pg-card: #ffffff; --pg-line: #9db0c2; --pg-acc: #d01012; --pg-font: ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, sans-serif; --pg-head: var(--pg-font); --pg-r: 16px; }
body { background-color: #cddbe6; background-image: radial-gradient(circle at 50% 42%, #eaf2f8 0 6px, #aebfce 6.6px 8px, transparent 8.6px); background-size: 38px 38px; font-weight: 600; }
.pg a { color: #0055bf; font-weight: 800; }
.pg-h { background: linear-gradient(90deg, #d01012 0 25%, #f5cd2f 25% 50%, #237841 50% 75%, #0055bf 75%) top left / 100% 10px no-repeat, #fff; padding: 28px 24px 18px; border-radius: 22px; border-bottom: 9px solid #aebfce; margin-top: 8px; }
.pg-k { color: #4a5a6e; font-weight: 800; }
.pg-h h1 { font-weight: 800; font-size: 38px; letter-spacing: -.01em; }
.pg-t { color: #34445a; font-weight: 600; }
.pg-nav a { border: 0; border-bottom: 5px solid #b4c3d1; border-radius: 12px; background: #e8eef4; padding: 8px 14px; font-weight: 800; color: #1b2330; }
.pg-nav a.on { background: #0055bf; border-bottom-color: #003a85; color: #fff; }
.pg-c { background: #fff; border: 0; border-bottom: 8px solid #aebfce; border-radius: 20px; padding: 14px 18px; }
.pg-cg > span { color: #4a5a6e; font-weight: 800; }
.pg-cg button, .pg-act button { border: 0; border-bottom: 5px solid #b4c3d1; border-radius: 11px; background: #e8eef4; color: #1b2330; font-weight: 800; padding: 7px 14px; }
.pg-cg button.on { background: #f5cd2f; border-bottom-color: #bd9407; color: #1b2330; }
.pg-act button { background: #d01012; border-bottom-color: #8f0a0c; color: #fff; padding: 11px 22px; font-size: 15px; }
.pg-n { color: #34445a; font-weight: 600; }
.pg-q > .pg-n { display: inline-block; background: #fff; padding: 4px 12px; border-radius: 10px; border-bottom: 4px solid #aebfce; }
.fw figcaption { display: inline-block; margin: 0 0 -2px 10px; padding: 4px 14px 6px; background: #fff; border-radius: 10px 10px 0 0; color: #1b2330; font-weight: 800; }
.fw.pc .frame { border: 5px solid #fff; border-bottom: 12px solid #9db0c2; border-radius: 24px; }
.fw.phone .frame { border-color: #1b2330; }
.pg-info > div { background: #fff; border-radius: 22px; border-bottom: 9px solid #aebfce; padding: 18px 22px 20px; }
.pg-info h2, .pg-q h2 { font-weight: 800; }
.pg-info li { margin: 7px 0; }
.pg-q > h2 { display: inline-block; background: #d01012; color: #fff; border-radius: 12px; border-bottom: 5px solid #8f0a0c; padding: 6px 16px; }
.q { border: 0; border-bottom: 8px solid #aebfce; border-radius: 20px; padding: 16px 20px 18px; position: relative; }
.q h3 { font-weight: 800; }
.q h3 span { background: #d01012; color: #fff; border-radius: 9px; border-bottom: 3px solid #8f0a0c; padding: 2px 9px; }
.q:nth-of-type(4n+2) h3 span { background: #0055bf; border-bottom-color: #003a85; }
.q:nth-of-type(4n+3) h3 span { background: #237841; border-bottom-color: #14502a; }
.q:nth-of-type(4n+4) h3 span { background: #f5cd2f; border-bottom-color: #bd9407; color: #1b2330; }
.q .opts label { font-weight: 700; }
.q input { accent-color: #d01012; width: 17px; height: 17px; margin-top: 2px; flex: none; }
.q .cm span { font-weight: 800; color: #4a5a6e; }
.q textarea { border: 3px solid #b4c3d1; border-radius: 12px; background: #f3f7fa; color: #1b2330; font-weight: 600; }
.pg details { background: #fff; border-radius: 14px; padding: 8px 14px; border-bottom: 5px solid #b4c3d1; }
.pg summary { font-weight: 800; cursor: pointer; }
.pg pre { border: 0; background: #f3f7fa; }
.pg-f { background: #fff; border: 0; border-bottom: 8px solid #aebfce; border-radius: 20px; padding: 16px 22px; max-width: none; color: #34445a; font-weight: 600; }

/* ---------- app base ---------- */
.rw { --red: #d01012; --red-d: #8f0a0c; --blue: #0055bf; --blue-d: #003a85; --yel: #f5cd2f; --yel-d: #bd9407; --grn: #237841; --grn-d: #14502a; --ink: #1b2330; --mut: #4a5a6e; --edge: #b4c3d1; --plate: #cddbe6; --soft: #eef4f9;
  display: flex; flex-direction: column; isolation: isolate; background: var(--plate); color: var(--ink); font: 700 14px/1.3 ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, sans-serif; scrollbar-color: #8fa4b8 transparent; }
.rw *, .rw *::before, .rw *::after { box-sizing: border-box; }
.rw ul, .rw ol { margin: 0; padding: 0; list-style: none; }
.rw h2, .rw h3, .rw h4, .rw p { margin: 0; }
.rw button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
.rw :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.rw svg.flag { flex: none; border-radius: 3px; box-shadow: 0 0 0 2px #fff; width: 26px; height: 17px; }
.rw svg.car { display: block; width: 100%; height: auto; }
.rw .car-pair { display: flex; gap: 3px; width: 100%; }
.rw .car-pair svg { display: block; flex: 1 1 0; min-width: 0; width: 50%; height: auto; }
/* a stud pair on top of a brick: the host sets --st */
.rw .sr::before, .rw .sr::after, .rw .cell:not(.out)::before, .rw .cell:not(.out)::after, .rw .lti::before, .rw .lti::after, .rw .exc::before, .rw .exc::after, .rw .hb::before, .rw .hb::after, .rw .brand::before, .rw .brand::after, .rw .pbtn::before, .rw .pbtn::after {
  content: ""; position: absolute; top: -5px; width: 15px; height: 6px; border-radius: 5px 5px 0 0; background: var(--st, #fff); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .42); pointer-events: none; }
.rw .sr::before, .rw .cell::before, .rw .lti::before, .rw .exc::before, .rw .hb::before, .rw .brand::before, .rw .pbtn::before { left: 12px; }
.rw .sr::after, .rw .cell::after, .rw .lti::after, .rw .exc::after, .rw .hb::after, .rw .brand::after, .rw .pbtn::after { left: 36px; }

/* ---------- top bar ---------- */
.rw .bar { position: relative; z-index: 6; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 14px 14px 16px; background: #fff; }
.rw .bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--red) 0 25%, var(--yel) 25% 50%, var(--grn) 50% 75%, var(--blue) 75%); }
.rw .hb { position: relative; width: 44px; height: 38px; border-radius: 10px; background: var(--red); border-bottom: 5px solid var(--red-d); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; --st: var(--red); }
.rw .hb i { display: block; width: 20px; height: 3.5px; border-radius: 2px; background: #fff; }
.rw .hb::before { left: 6px; }
.rw .hb::after { left: 23px; }
.rw .brand { position: relative; padding: 5px 12px 4px; border-radius: 9px; background: var(--yel); border-bottom: 5px solid var(--yel-d); font-weight: 800; font-size: 17px; letter-spacing: .01em; --st: var(--yel); }
.rw .seg { display: flex; gap: 6px; }
.rw .seg button { position: relative; padding: 7px 12px 5px; border-radius: 10px; background: #e8eef4; border-bottom: 5px solid var(--edge); font-weight: 800; font-size: 13px; }
.rw .seg button.on { background: var(--blue); color: #fff; border-bottom-color: var(--blue-d); }
.rw .seg button.auto.on { background: var(--grn); border-bottom-color: var(--grn-d); }
.rw .mn { display: flex; align-items: center; gap: 6px; }
.rw .mn.sp { display: none; }
.rw .mn b { font-size: 16px; font-weight: 800; min-width: 118px; text-align: center; }
.rw .mn button { width: 32px; height: 32px; border-radius: 9px; background: #e8eef4; border-bottom: 4px solid var(--edge); font-size: 21px; line-height: 1; text-align: center; }
.rw .opts { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rw .chip { padding: 7px 12px 5px; border-radius: 10px; background: #e8eef4; border-bottom: 5px solid var(--edge); font-weight: 800; font-size: 13px; }
.rw .opts select { font: 800 13px/1.2 inherit; font-family: inherit; padding: 6px 6px 4px; border-radius: 10px; border: 0; border-bottom: 5px solid var(--edge); background: #e8eef4; color: var(--ink); max-width: 100%; cursor: pointer; }
.rw label.spoil { position: relative; cursor: pointer; display: block; }
.rw label.spoil input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.rw label.spoil span { position: relative; display: block; padding: 7px 12px 5px 54px; border-radius: 10px; background: #8d9bab; color: #fff; border-bottom: 5px solid #5d6b7b; font-weight: 800; font-size: 13px; white-space: nowrap; }
.rw label.spoil span::before { content: ""; position: absolute; left: 10px; top: 50%; margin-top: -9px; width: 34px; height: 18px; border-radius: 6px; background: rgba(0, 0, 0, .25); }
.rw label.spoil span::after { content: ""; position: absolute; left: 12px; top: 50%; margin-top: -7px; width: 14px; height: 14px; border-radius: 4px; background: #fff; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .16); }
.rw label.spoil input:checked + span { background: var(--grn); border-bottom-color: var(--grn-d); }
.rw label.spoil input:checked + span::after { left: 28px; }
.rw label.spoil input:focus-visible + span { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------- shell, plate ---------- */
.rw .shell { flex: 1 1 auto; min-height: 0; display: flex; }
.rw .view { flex: 1 1 auto; min-width: 0; overflow: auto; padding: 18px 16px 100px; background-color: var(--plate); background-image: radial-gradient(circle at 50% 42%, #eaf2f8 0 5px, #aebfce 5.5px 7px, transparent 7.6px); background-size: 32px 32px; background-attachment: local; }

/* ---------- series tray ---------- */
.rw .menu { flex: 0 0 196px; margin: 12px 0 12px 12px; padding: 12px 10px 12px; display: flex; flex-direction: column; min-height: 0; overflow: auto; background: #fff; border-radius: 22px; border-bottom: 9px solid #aebfce; }
.rw .menu-h { padding: 2px 6px 10px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--mut); }
.rw .menu ul { display: grid; gap: 10px; }
.rw .si { position: relative; padding: 8px; border-radius: 16px; background-color: #dfe8f0; background-image: radial-gradient(circle at 50% 50%, #f6fafd 0 3px, #b9c8d6 3.5px 4.6px, transparent 5.2px); background-size: 18px 18px; display: flex; flex-direction: column; }
.rw .si > button { position: relative; width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 6px; padding: 7px; border-radius: 12px; background: var(--c); color: var(--cx, #fff); border-bottom: 6px solid rgba(0, 0, 0, .28); text-align: left; }
.rw .si > button::before { content: ""; position: absolute; top: -5px; left: 14px; width: 15px; height: 6px; border-radius: 5px 5px 0 0; background: var(--c); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .42); }
.rw .si > button::after { content: ""; position: absolute; top: -5px; left: 38px; width: 15px; height: 6px; border-radius: 5px 5px 0 0; background: var(--c); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .42); }
.rw .si .cw { grid-column: 1 / -1; display: block; background: #fff; border-radius: 9px; padding: 4px 6px; border-bottom: 3px solid rgba(0, 0, 0, .14); }
.rw .si .nm { font-size: 13px; font-weight: 800; line-height: 1.15; }
.rw .si .tg { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: rgba(255, 255, 255, .92); color: var(--ink); }
.rw .si.off > button { filter: grayscale(1); opacity: .5; }
.rw .si.off .tg { background: #1b2330; color: #fff; }
.rw .cls { display: flex; gap: 6px; margin-top: 8px; }
.rw .cls button { flex: 1; padding: 5px 4px 3px; border-radius: 8px; background: #fff; border-bottom: 4px solid var(--edge); font-size: 11px; font-weight: 800; text-align: center; }
.rw .cls button.on { background: var(--yel); border-bottom-color: var(--yel-d); }
.rw .sn { margin-top: 7px; font-size: 10.5px; line-height: 1.25; color: var(--mut); text-align: center; font-weight: 700; }
.rw .menu-f { margin-top: 12px; padding: 0 4px; font-size: 10.5px; line-height: 1.35; font-weight: 600; color: var(--mut); }
.rw[data-menu="closed"][data-mode="wide"] .menu { flex-basis: 84px; padding: 12px 7px; }
.rw[data-menu="closed"][data-mode="wide"] .menu-h, .rw[data-menu="closed"][data-mode="wide"] .menu-f, .rw[data-menu="closed"][data-mode="wide"] .si .nm, .rw[data-menu="closed"][data-mode="wide"] .si .tg, .rw[data-menu="closed"][data-mode="wide"] .cls, .rw[data-menu="closed"][data-mode="wide"] .sn { display: none; }
.rw[data-menu="closed"][data-mode="wide"] .menu ul { gap: 10px; }
.rw[data-menu="closed"][data-mode="wide"] .si { padding: 5px; }
.rw[data-menu="closed"][data-mode="wide"] .si > button { padding: 5px; display: block; }
.rw[data-menu="closed"][data-mode="wide"] .si > button::before { left: 7px; }
.rw[data-menu="closed"][data-mode="wide"] .si > button::after { left: 29px; }
.rw[data-menu="closed"][data-mode="wide"] .si .cw { padding: 3px 4px; }
.rw .scrim-m { display: none; }

/* ---------- month, wide ---------- */
.rw .dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.rw .dow span { text-align: center; padding: 5px 0 3px; background: #fff; border-radius: 10px; border-bottom: 4px solid var(--edge); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.rw .dow span:nth-child(n+6) { background: var(--yel); border-bottom-color: var(--yel-d); }
.rw .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(92px, auto); gap: 12px 6px; }
.rw .cell { position: relative; min-width: 0; background: #fff; border-radius: 14px; border-bottom: 6px solid var(--edge); padding: 8px 9px; --st: #fff; }
.rw .cell:not(.ev) { background: #fbfdfe; }
.rw .cell.out { background: #dbe5ee; border-bottom-color: #c3d0dc; }
.rw .cell.out .dn { color: #6d7d90; }
.rw .cell > .dn { font-size: 16px; font-weight: 800; color: var(--mut); }
.rw .cell.today:not(.ev) { box-shadow: 0 0 0 3px var(--yel); }
.rw .cell.today:not(.ev) > .dn { background: var(--red); color: #fff; border-radius: 8px; padding: 1px 8px; display: inline-block; }
.rw .cell.ev { --tile: color-mix(in srgb, var(--t, #0055bf) 17%, #fff); --st: var(--t, #0055bf); background: var(--tile); border-bottom-color: var(--t, #0055bf); border-radius: 16px; cursor: pointer; padding: 8px 8px 10px; }
.rw .cell.ev.today { box-shadow: 0 0 0 3px #1b2330; }
.rw .bg { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
.rw .bg svg.out { position: absolute; left: 50%; top: 52%; width: 92%; height: 92%; transform: translate(-50%, -50%); color: #fff; }
.rw .bg svg.out path { stroke: #fff; stroke-width: 40; opacity: .92; }
.rw .bg svg.scene { position: absolute; right: -8%; bottom: -6%; width: 64%; height: auto; color: var(--t, #0055bf); opacity: .16; -webkit-mask-image: radial-gradient(ellipse at 100% 100%, #000 0, transparent 78%); mask-image: radial-gradient(ellipse at 100% 100%, #000 0, transparent 78%); }
.rw .bg .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, var(--tile, transparent) 0, transparent 70%); }
.rw .hd { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-height: 28px; }
.rw .cell .hd > svg.flag { order: 1; }
.rw .cell .hd > .dn { order: 2; margin-left: auto; }
.rw .cell .hd > .loc { order: 3; flex: 1 1 100%; }
.rw .loc { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; flex: 1 1 auto; }
.rw .loc b { font-size: 13px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rw .loc em { font-style: normal; font-size: 10.5px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.rw .cell.ev .hd .dn { flex: none; min-width: 26px; text-align: center; padding: 2px 6px 0; border-radius: 8px; background: var(--t, #0055bf); color: var(--tx, #fff); font-size: 15px; font-weight: 800; }
.rw .cell .rn { position: relative; margin: 5px 0 10px; font-size: 11.5px; line-height: 1.2; font-weight: 800; }
.rw ul.sl { position: relative; display: grid; gap: 11px; }

/* a session is a 1 x 2 brick */

.rw li.more { padding-top: 0; }

/* ---------- month, narrow ---------- */

/* ---------- weekend card ---------- */

.rw .wf { padding: 4px 16px 0; }
.rw .pbtn { position: relative; width: 100%; padding: 13px 14px 10px; text-align: center; border-radius: 14px; background: var(--red); color: #fff; border-bottom: 6px solid var(--red-d); font-size: 15px; font-weight: 800; --st: var(--red); }

/* ---------- list ---------- */
.rw .list { display: grid; gap: 40px; max-width: 980px; margin: 0 auto; padding-top: 6px; }

.rw .lh .bg { border-radius: 16px; }
.rw .lh .bg svg.out { left: auto; right: 2%; top: 50%; width: auto; height: 150%; aspect-ratio: 1; transform: translateY(-50%); }
.rw .lh .bg svg.out path { stroke: rgba(255, 255, 255, .5); stroke-width: 36; opacity: 1; }
.rw .lh .bg .scrim { display: none; }
.rw .lt { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; row-gap: 3px; align-items: center; }

.rw .lt .chips .sc { padding: 2px 9px 0; border-radius: 6px; background: var(--c); color: var(--cx, #fff); border: 2px solid #fff; font-size: 11px; font-weight: 800; }
.rw .lts { display: grid; gap: 12px; padding: 4px 4px 2px; }
.rw .lti { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 3px 12px; padding: 9px 14px 7px; border-radius: 12px; background: var(--c); color: var(--cx, #fff); border-bottom: 6px solid rgba(0, 0, 0, .28); cursor: pointer; --st: var(--c); }

.rw .lti .tm small { display: block; font-size: 10px; font-weight: 700; opacity: .88; line-height: 1.1; }
.rw .lti .sc { font-size: 11px; font-weight: 800; padding: 2px 7px 0; border-radius: 6px; background: color-mix(in srgb, var(--cx, #fff) 20%, transparent); }
.rw .lti .nm { flex: 1 1 150px; font-size: 14px; font-weight: 700; line-height: 1.2; min-width: 0; }
.rw .lti .nm i { font-style: normal; font-size: 11px; opacity: .88; }

/* ---------- round yellow brick button ---------- */
.rw .fab { position: absolute; right: 22px; bottom: 20px; z-index: 10; width: 82px; height: 82px; border-radius: 50%; background: var(--yel); border-bottom: 8px solid var(--yel-d); box-shadow: 0 6px 14px rgba(27, 35, 48, .3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding-top: 6px; }
.rw .fab::before { content: ""; position: absolute; top: -7px; left: 50%; margin-left: -17px; width: 34px; height: 9px; border-radius: 8px 8px 0 0; background: var(--yel); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .5); }
.rw .fab svg.head { width: 44px; height: 44px; }
.rw .fab span { font-size: 10.5px; font-weight: 800; line-height: 1; color: var(--ink); margin-top: 1px; }
.rw .fab:hover { filter: brightness(1.06); }

/* ---------- layers ---------- */
.rw .pop-layer, .rw .champ-layer { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 22px; background: rgba(27, 35, 48, .58); }

.rw .pop { max-width: 680px; --pc: #aebfce; }
.rw .champ { max-width: 880px; --pc: var(--yel-d); }
.rw .ph { position: sticky; top: 0; z-index: 3; padding: 30px 64px 16px 22px; background: var(--c, #0055bf); color: var(--cx, #fff); }
.rw .ph::before, .rw .chh::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 15px; background: radial-gradient(circle at 50% 56%, rgba(255, 255, 255, .5) 0 3.4px, rgba(0, 0, 0, .16) 3.8px 5.4px, transparent 6px) 0 0 / 28px 15px repeat-x; }
.rw .pl { display: flex; align-items: center; gap: 12px; }
.rw .pl svg.flag { width: 46px; height: 31px; border-radius: 5px; box-shadow: 0 0 0 3px #fff; }
.rw .pl .loc b { font-size: 26px; line-height: 1.05; overflow: visible; white-space: normal; }
.rw .pl .loc em { font-size: 13.5px; color: inherit; opacity: .92; overflow: visible; white-space: normal; }
.rw .ph .rn { margin-top: 9px; font-size: 16px; font-weight: 800; }
.rw .ph .pd { margin-top: 2px; font-size: 13px; font-weight: 700; opacity: .94; }
.rw .x { position: absolute; top: 18px; right: 14px; width: 40px; height: 38px; border-radius: 10px; background: #fff; color: var(--ink); border-bottom: 5px solid rgba(0, 0, 0, .25); font-size: 26px; font-weight: 800; line-height: 1; text-align: center; padding-bottom: 2px; }
.rw .x:hover { background: #fffbe3; }
.rw .pbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding: 22px 22px 22px; }
.rw .pbody > *, .rw .chb > * { min-width: 0; }
.rw .pbody h3, .rw .chb h3 { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 10px; font-size: 17px; font-weight: 800; }
.rw .clk { margin-bottom: 14px; font-size: 12.5px; line-height: 1.4; color: var(--mut); font-weight: 600; }
.rw .ps { position: relative; margin-bottom: 16px; padding: 12px 12px 14px; background: color-mix(in srgb, var(--c) 13%, #fff); border-radius: 16px; border-bottom: 7px solid var(--c); }

.rw .psh .cw { position: relative; flex: none; width: 112px; padding: 6px 8px 5px; background: var(--c); border-radius: 11px; border-bottom: 5px solid rgba(0, 0, 0, .28); }

.rw .psh .cw::after { left: 34px; }

.rw .psh b { font-size: 17px; font-weight: 800; }
.rw .psh em { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 700; color: var(--mut); }

.rw .wxs { padding: 14px 14px 14px; background: var(--soft); border-radius: 16px; border-bottom: 7px solid var(--edge); }

.rw .hr { position: relative; flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px 5px; background: #fff; border-radius: 10px; border-bottom: 5px solid var(--edge); text-align: center; }
.rw .hr::before { content: ""; position: absolute; top: -5px; left: 50%; margin-left: -8px; width: 16px; height: 6px; border-radius: 5px 5px 0 0; background: #fff; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .42); }

  Q.push({ id: 'menu', q: 'Series menu. This page uses ' + DIR.q.menu + ' Is that the form you want?', type: 'radio', opts: ['Keep this form', 'A plain text list is enough', 'Prefer another form (say which)'] });
  Q.push({ id: 'clock', q: 'Which time is big in the calendar and list: your time or the track\'s time?', type: 'radio', opts: ['Your time big, track time small (as here)', 'Track time big, your time small', 'The user chooses, with a switch (as here)', 'Your time only'] });
  Q.push({ id: 'popup', q: 'Day detail. This page uses ' + DIR.q.pop + ' Is that the form you want?', type: 'radio', opts: ['Keep this form', 'A centred window on every device', 'Side panel on PC and full screen on phone', 'A page of its own (no window)'] });
  Q.push({ id: 'weather', q: 'Weather detail. The hourly view runs from 1 hour before the first session to 1 hour after the last. How much per hour?', type: 'radio', opts: ['Compact: icon, temperature, rain chance', 'As here: plus wind', 'More: plus gusts, humidity and rain amount'] });
  Q.push({ id: 'radar', q: 'Rain radar (a moving map of the rain around the track) is out of version 1 and still open. What should we do with it?', type: 'radio', opts: ['Leave it out of version 1 (recommended)', 'Put it in version 1 (needs another service and more time)', 'Later version, keep it on the list'] });
  Q.push({ id: 'champ', q: 'Champion window. This page uses ' + DIR.q.champ + ' What should it have?', type: 'radio', opts: ['This form as it is', 'The worked examples only, no calculator', 'The calculator only', 'Both examples and calculator'] });
  Q.push({ id: 'fe', q: 'Formula E car. It is a plain grey stand-in until the Formula E research is done. What look do you want for it?', type: 'radio', opts: ['Plain grey until the research', 'Electric blue', 'Purple', 'Decide after the research'] });
  Q.push({ id: 'twoc', q: 'Weekend card on a phone when two venues race the same weekend (Silverstone and the Formula E stand-in, "Sat 4 Jul 2026" above). How do the two cards show?', type: 'radio', opts: ['Stacked, one under the other (as here)', 'Swiped sideways, one at a time', 'One card with a venue switch'] });
  (DIR.extra || []).forEach(function (x) { Q.push(x); });
  Q.push({ id: 'keep', q: 'Which parts of this direction do you want to keep, even if you pick another one?', type: 'checkbox', opts: ['Series menu', 'Month calendar', 'Day cells (flag, track silhouette)', 'Day detail window', 'Race list', 'Weekend card', 'Champion window', 'Floating button and head', 'Colours and type', 'Car and flag drawings'] });

  function qHtml(q, i) {
    return '<section class="q" data-q="' + q.id + '"><h3><span>Q' + (i + 1) + '</span>' + esc(q.q) + '</h3><div class="opts">' + q.opts.map(function (o, k) {
      return '<label><input type="' + q.type + '" name="q-' + q.id + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>';
    }).join('') + '</div><label class="cm"><span>Comment (optional)</span><textarea rows="2" placeholder="Anything you want to add about this question"></textarea></label></section>';
  }
  var h = '';
  h += '<header class="pg-h"><div><p class="pg-k">rawe_ceek · racing calendar · design direction ' + DIR.letter + ' of 4</p><h1>' + esc(DIR.name) + '</h1><p class="pg-t">' + esc(DIR.tag) + '</p></div><nav class="pg-nav" aria-label="The four directions">' + FILES.map(function (f) { return '<a href="' + f[1] + '"' + (f[0] === DIR.letter ? ' class="on" aria-current="page"' : '') + '><b>' + f[0] + '</b> ' + f[2] + '</a>'; }).join('') + '</nav></header>';
  h += '<section class="pg-c"><div class="pg-cg"><span>Window</span><button data-dev="pc">PC window</button><button data-dev="phone">Phone</button><button data-dev="both" class="on">Both</button></div><div class="pg-cg"><span>Simulated today</span>' + RW.sims.map(function (s, i) { return '<button data-sim="' + i + '" class="' + (i ? '' : 'on') + '" title="' + esc(s.sub) + '">' + esc(s.label) + '</button>'; }).join('') + '</div><p class="pg-n">Simulated today moves only the app clock (cells, "in 2 h", weekend card). The weather call uses the real date. Click anything in the frames: it works.</p></section>';
  h += '<div class="pg-frames"><figure class="fw pc"><figcaption>PC-sized window</figcaption><div class="frame"><div class="rw" id="rw-pc"></div></div></figure><figure class="fw phone"><figcaption>Phone</figcaption><div class="frame"><div class="rw" id="rw-ph"></div></div></figure></div>';
  h += '<section class="pg-info"><div><h2>What to look at</h2><ul>' + DIR.look.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div><div><h2>What is real on this page</h2><ul><li><b>REAL</b>: Silverstone F1 times (Jolpica), Qatar, Abu Dhabi and Las Vegas F1 times (Jolpica), the WEC Monza times and results, Las Vegas and Qatar series times from the research note, the standings of the champion window, the track outlines (Formula One Database).</li><li><b>SAMPLE</b>: results rows the research does not list; Silverstone F2, F3 and F1 Academy times (invented to show a full weekend); the weather call falls back to a sample, with a visible badge, if it cannot be reached.</li><li><b>STAND-IN</b>: the corner pictures (generic drawings, you review the 30 real corners first), all cars and flags (hand-drawn, no logos), the Leclerc head (brick-style stand-in, Blender comes later), the Formula E round (a made-up "Sample City" E-Prix).</li></ul></div></section>';
  h += '<section class="pg-q"><h2>Open questions</h2><p class="pg-n">Pick what you like, add a comment to any question (optional), then copy or save the answers.</p><form id="qform" onsubmit="return false">' + Q.map(qHtml).join('') + '<section class="q" data-q="more"><h3><span>Last</span>Additional comments</h3><label class="cm"><span>Anything else (optional)</span><textarea rows="4" placeholder="Anything else you want to tell us"></textarea></label></section></form><div class="pg-act"><button id="q-copy">Copy answers</button><button id="q-save">Save as .txt</button><span id="q-st" role="status"></span></div><details><summary>Preview of the text</summary><pre id="q-prev"></pre></details></section>';
  h += '<footer class="pg-f"><p>Unofficial fan-made design study. Not associated with the Formula 1 companies, the FIA, Ferrari, the LEGO Group, any team, driver or series. No logos or wordmarks of any series, team or sponsor appear on this page.</p><p>Track outlines: <a href="https://github.com/f1db/f1db" target="_blank" rel="noopener">Formula One Database (F1DB)</a>, CC BY 4.0. Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>. Session times: Jolpica F1 API (CC BY-NC-SA 4.0) and the research note of 26 Nov 2026. Formula E facts come later (RW.RESEARCH.FE). WEC: Hypercar is the default class, LMGT3 is a switch in the menu.</p></footer>';
  root.className = 'pg'; root.setAttribute('data-dev', 'both'); root.innerHTML = h;

  RW.mount(document.getElementById('rw-pc'), 'auto'); RW.mount(document.getElementById('rw-ph'), 'auto');
  root.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-dev')) { root.setAttribute('data-dev', b.getAttribute('data-dev')); [].forEach.call(root.querySelectorAll('[data-dev]'), function (x) { if (x.tagName === 'BUTTON') x.classList.toggle('on', x === b); }); }
    if (b.hasAttribute('data-sim')) { RW.setSim(+b.getAttribute('data-sim')); [].forEach.call(root.querySelectorAll('[data-sim]'), function (x) { x.classList.toggle('on', x === b); }); }
  });
  function collect() {
    var out = ['rawe_ceek design answers: direction ' + DIR.letter + ' (' + DIR.name + '), ' + new Date().toISOString().slice(0, 10), ''];
    [].forEach.call(root.querySelectorAll('.q'), function (s, i) {
      var id = s.getAttribute('data-q'), q = Q.filter(function (x) { return x.id === id; })[0], ch = [].map.call(s.querySelectorAll('input:checked'), function (x) { return x.value; }), cm = s.querySelector('textarea').value.trim();
      out.push(q ? 'Q' + (Q.indexOf(q) + 1) + '. ' + q.q : 'Additional comments');
      if (q) out.push('Answer: ' + (ch.length ? ch.join('; ') : '(no choice)'));
      out.push((q ? 'Comment on Q' + (Q.indexOf(q) + 1) + ': ' : 'Text: ') + (cm || '(none)')); out.push('');
    });
    return out.join('\n');
  }
  var prev = document.getElementById('q-prev'), st = document.getElementById('q-st');
  function upd() { prev.textContent = collect(); }
  root.addEventListener('input', upd); root.addEventListener('change', upd); upd();
  document.getElementById('q-copy').addEventListener('click', function () {
    var t = collect();
    function done(ok) { st.textContent = ok ? 'Copied ' + t.length + ' characters.' : 'Copy was blocked: open "Preview of the text" and copy from there.'; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { done(true); }, function () { var x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) { } document.body.removeChild(x); done(ok); });
    else { var x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) { } document.body.removeChild(x); done(ok); }
  });
  document.getElementById('q-save').addEventListener('click', function () {
    var t = collect(), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/plain' })); a.download = 'rw-design-' + DIR.letter.toLowerCase() + '-answers.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a); st.textContent = 'Saved ' + a.download + '.';
  });
})();

</script></body></html>
