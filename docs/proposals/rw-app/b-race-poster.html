<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rawe_ceek design B</title><style>
/* Page shell: layout only. A direction sets the --pg-* variables and may restyle anything under .pg. The app itself (.rw) is styled completely by the direction. */
:root { --pg-bg: #14161a; --pg-fg: #e9eaee; --pg-mut: #9aa0ac; --pg-card: #1d2026; --pg-line: #343943; --pg-acc: #e10600; --pg-font: system-ui, "Segoe UI", sans-serif; --pg-head: var(--pg-font); --pg-r: 10px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--pg-bg); color: var(--pg-fg); font: 15px/1.5 var(--pg-font); }
.pg { max-width: 1560px; margin: 0 auto; padding: 22px 22px 60px; }
.pg a { color: var(--pg-acc); }
.pg-h { display: flex; flex-wrap: wrap; gap: 14px 30px; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.pg-k { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--pg-mut); }
.pg-h h1 { margin: 2px 0 4px; font: 700 34px/1.1 var(--pg-head); }
.pg-t { margin: 0; max-width: 70ch; color: var(--pg-mut); }
.pg-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.pg-nav a { padding: 6px 12px; border: 1px solid var(--pg-line); border-radius: 99px; color: var(--pg-fg); text-decoration: none; font-size: 13px; }
.pg-nav a.on { background: var(--pg-fg); color: var(--pg-bg); }
.pg-c { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; margin: 10px 0 16px; padding: 10px 12px; border: 1px solid var(--pg-line); border-radius: var(--pg-r); background: var(--pg-card); }
.pg-cg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pg-cg > span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--pg-mut); margin-right: 4px; }
.pg-cg button, .pg-act button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--pg-line); background: transparent; color: var(--pg-fg); cursor: pointer; }
.pg-cg button.on, .pg-act button { background: var(--pg-fg); color: var(--pg-bg); border-color: var(--pg-fg); }
.pg-n { margin: 0; flex-basis: 100%; font-size: 12.5px; color: var(--pg-mut); }
.pg-frames { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; }
.fw { margin: 0; }
.fw figcaption { margin: 0 0 6px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--pg-mut); }
.fw.pc { flex: 1 1 880px; min-width: 880px; }
.fw.phone { flex: 0 0 392px; width: 392px; }
.frame { position: relative; height: 800px; overflow: hidden; border: 1px solid var(--pg-line); border-radius: 12px; }
.fw.phone .frame { border: 7px solid #000; border-radius: 38px; box-shadow: 0 0 0 1px var(--pg-line); }
.rw { position: absolute; inset: 0; overflow: hidden; }
.pg[data-dev="pc"] .fw.phone, .pg[data-dev="phone"] .fw.pc { display: none; }
.pg-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; margin: 26px 0; }
.pg-info h2, .pg-q h2 { font: 700 20px/1.2 var(--pg-head); margin: 0 0 8px; }
.pg-info ul { margin: 0; padding-left: 18px; } .pg-info li { margin: 4px 0; }
.pg-q { max-width: 920px; margin-top: 30px; }
.q { margin: 14px 0; padding: 14px 16px; border: 1px solid var(--pg-line); border-radius: var(--pg-r); background: var(--pg-card); }
.q h3 { margin: 0 0 8px; font: 600 15.5px/1.4 var(--pg-font); }
.q h3 span { display: inline-block; min-width: 38px; margin-right: 8px; padding: 1px 8px; border-radius: 99px; background: var(--pg-fg); color: var(--pg-bg); font-size: 12px; text-align: center; }
.q .opts { display: grid; gap: 4px; margin-bottom: 8px; }
.q .opts label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.q .cm { display: block; } .q .cm span { display: block; font-size: 12px; color: var(--pg-mut); margin-bottom: 2px; }
.q textarea { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--pg-line); background: var(--pg-bg); color: var(--pg-fg); resize: vertical; }
.pg-act { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0; }
.pg-act button { padding: 9px 18px; font-weight: 600; font-size: 14px; }
.pg details { margin: 6px 0; } .pg pre { white-space: pre-wrap; font: 12.5px/1.45 ui-monospace, Consolas, monospace; background: var(--pg-card); padding: 12px; border-radius: 8px; border: 1px solid var(--pg-line); }
.pg-f { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--pg-line); font-size: 12.5px; color: var(--pg-mut); max-width: 100ch; }

/* RW direction B: Race poster. Warm paper, near-black ink, one printed red, one deep blue, serif type, thick and double rules, square corners. No dark mode. */
:root {
  --paper: #f2e9d6; --paper2: #e8dbbd; --paper3: #f8f2e3; --ink: #1b1713; --ink2: #51463a; --red: #c8351f; --blue: #1d3b63;
  --serif: Georgia, "Times New Roman", ui-serif, serif;
  --hair: rgba(27, 23, 19, .45);
  --grain: radial-gradient(rgba(27, 23, 19, .075) .6px, transparent .95px) 0 0 / 3px 3px, radial-gradient(rgba(110, 80, 40, .07) .6px, transparent 1px) 1px 2px / 5px 5px, radial-gradient(ellipse at 14% 0%, rgba(255, 255, 255, .30), transparent 55%), radial-gradient(ellipse at 100% 100%, rgba(140, 100, 50, .12), transparent 60%);
  --pg-bg: #f2e9d6; --pg-fg: #1b1713; --pg-mut: #51463a; --pg-card: #f8f2e3; --pg-line: #1b1713; --pg-acc: #c8351f; --pg-font: Georgia, "Times New Roman", ui-serif, serif; --pg-head: Georgia, "Times New Roman", ui-serif, serif; --pg-r: 0;
}

/* ---------- the page around the frames, printed sheet ---------- */
body { background: var(--grain), var(--paper); font-size: 16px; line-height: 1.5; }
.pg a { color: var(--blue); text-underline-offset: 3px; }
.pg-h { border-top: 10px solid var(--ink); border-bottom: 5px double var(--ink); padding: 10px 0 14px; margin-bottom: 20px; align-items: flex-end; }
.pg-k { font: italic 700 15px/1.3 var(--serif); font-variant: small-caps; letter-spacing: .14em; text-transform: none; color: var(--red); }
.pg-h h1 { margin: 2px 0 6px; font: 900 clamp(48px, 7vw, 92px)/.88 var(--serif); text-transform: uppercase; letter-spacing: -.04em; transform: scale(.92, 1.06); transform-origin: left bottom; }
.pg-t { font: italic 400 19px/1.4 var(--serif); color: var(--ink2); max-width: 62ch; }
.pg-nav { gap: 0; }
.pg-nav a { padding: 8px 14px; border: 2px solid var(--ink); border-radius: 0; margin-left: -2px; background: var(--paper3); color: var(--ink); font: 700 15px/1.2 var(--serif); font-variant: small-caps; letter-spacing: .06em; }
.pg-nav a.on { background: var(--ink); color: var(--paper3); }
.pg-nav a:hover { background: var(--paper2); }
.pg-nav a.on:hover { background: var(--ink); }
.pg-c { border: 2px solid var(--ink); border-radius: 0; background: var(--paper3); box-shadow: 4px 4px 0 var(--ink); }
.pg-cg > span { font: italic 700 14px var(--serif); font-variant: small-caps; letter-spacing: .12em; text-transform: none; color: var(--red); }
.pg-cg button, .pg-act button { border-radius: 0; border: 2px solid var(--ink); font-family: var(--serif); font-weight: 700; background: var(--paper); color: var(--ink); }
.pg-cg button.on, .pg-act button { background: var(--ink); color: var(--paper3); border-color: var(--ink); }
.pg-act button { box-shadow: 3px 3px 0 var(--red); }
.pg-n { font-style: italic; }
.fw figcaption { font: italic 700 14px var(--serif); font-variant: small-caps; letter-spacing: .14em; text-transform: none; color: var(--ink2); }
.fw.pc .frame { border: 3px solid var(--ink); border-radius: 0; box-shadow: 7px 7px 0 var(--ink); }
.fw.phone .frame { border-color: var(--ink); box-shadow: 6px 6px 0 var(--ink); }
.pg-info h2, .pg-q h2 { font: 900 24px/1.1 var(--serif); text-transform: uppercase; letter-spacing: -.01em; border-bottom: 3px double var(--ink); padding-bottom: 4px; }
.pg-info li { font-size: 16px; }
.q { background: var(--paper3); border: 2px solid var(--ink); border-radius: 0; box-shadow: 4px 4px 0 var(--ink); }
.q h3 { font: 700 17px/1.4 var(--serif); }
.q h3 span { border-radius: 0; background: var(--red); color: var(--paper3); font: 700 13px var(--serif); letter-spacing: .06em; transform: rotate(-3deg); }
.q .opts label { font-size: 16px; }
.q .opts input { accent-color: var(--red); width: 17px; height: 17px; margin-top: 3px; }
.q .cm span { font: italic 14px var(--serif); color: var(--ink2); }
.q textarea { border: 1.5px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); }
.pg pre { background: var(--paper3); border: 1.5px solid var(--ink); border-radius: 0; color: var(--ink); }
.pg-f { border-top: 3px double var(--ink); font-style: italic; color: var(--ink2); }
.pg :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------- the app ---------- */
.rw { isolation: isolate; display: flex; flex-direction: column; font-family: var(--serif); font-size: 14px; line-height: 1.35; color: var(--ink); background: var(--grain), var(--paper); -webkit-font-smoothing: antialiased; }
.rw *, .rw *::before, .rw *::after { box-sizing: border-box; }
.rw button, .rw select { font-family: var(--serif); color: inherit; }
.rw button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; font-size: inherit; line-height: inherit; text-align: inherit; }
.rw ul, .rw ol { margin: 0; padding: 0; list-style: none; }
.rw h2, .rw h3, .rw h4, .rw p { margin: 0; }
.rw :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.rw sup { font-size: .68em; line-height: 0; color: var(--red); font-weight: 700; margin-left: 1px; }
.rw svg.flag { display: block; flex: none; width: 32px; height: 21px; border: 1.5px solid var(--ink); filter: saturate(.82) contrast(1.04); }

/* header bar: the masthead */
.rw .bar { position: relative; z-index: 40; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 14px 9px; background: var(--grain), var(--paper); border-top: 7px solid var(--ink); border-bottom: 5px double var(--ink); }
.rw .hb { flex: none; width: 44px; height: 44px; border: 2px solid var(--ink); background: var(--paper3); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
.rw .hb i { display: block; width: 22px; height: 3px; background: var(--ink); transition: transform .2s, opacity .2s; }
.rw .hb[aria-expanded="true"] { background: var(--ink); }
.rw .hb[aria-expanded="true"] i { background: var(--paper3); }
.rw .hb[aria-expanded="true"] i:nth-child(1) { transform: translateY(8px) rotate(45deg); }
.rw .hb[aria-expanded="true"] i:nth-child(2) { opacity: 0; }
.rw .hb[aria-expanded="true"] i:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
.rw .brand { flex: none; font: italic 900 22px/1 var(--serif); text-transform: uppercase; letter-spacing: .02em; color: var(--red); border: 3px double var(--red); padding: 6px 10px 5px; transform: rotate(-2.5deg); white-space: nowrap; }
.rw .seg { display: flex; }
.rw .seg button { min-height: 44px; padding: 0 14px; font: 700 18px var(--serif); font-variant: small-caps; letter-spacing: .08em; border-bottom: 4px solid transparent; border-left: 1px solid var(--hair); text-align: center; }
.rw .seg button:first-child { border-left: 0; }
.rw .seg button.auto { font-style: italic; }
.rw .seg button.on { border-bottom-color: var(--red); background: var(--paper3); }
.rw .seg button:hover:not(.on) { background: var(--paper2); }
.rw .mn { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 2px; }
.rw .mn.sp { display: block; }
.rw .mn button { width: 40px; height: 40px; border: 1.5px solid var(--ink); background: var(--paper3); font: 700 26px/1 var(--serif); text-align: center; }
.rw .mn button:hover { background: var(--ink); color: var(--paper3); }
.rw .mn b { min-width: 9em; text-align: center; font: italic 700 23px/1 var(--serif); letter-spacing: -.01em; }
.rw .opts { flex: none; display: flex; align-items: center; gap: 12px; }
.rw .chip { min-height: 40px; padding: 0 4px; color: var(--blue); font: italic 700 16px var(--serif); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.rw .opts select { min-height: 40px; max-width: 170px; padding: 0 8px; border: 1.5px solid var(--ink); border-radius: 0; background: var(--paper3); font: italic 400 15px var(--serif); color: var(--ink); }
.rw[data-mode="narrow"] .bar { gap: 4px 6px; padding: 6px 8px 7px; }
.rw[data-mode="narrow"] .hb { order: 1; }
.rw[data-mode="narrow"] .brand { order: 2; margin-right: auto; font-size: 15px; padding: 4px 7px 3px; border-width: 2px; }
.rw[data-mode="narrow"] .mn { order: 3; flex: none; }
.rw[data-mode="narrow"] .mn.sp { display: none; }
.rw[data-mode="narrow"] .mn b { min-width: 7em; font-size: 17px; }
.rw[data-mode="narrow"] .seg { order: 4; flex: 1 0 100%; border-top: 1px solid var(--ink); }
.rw[data-mode="narrow"] .seg button { flex: 1 1 0; padding: 0 2px; font-size: 16px; letter-spacing: .04em; }
.rw[data-mode="narrow"] .opts { order: 5; flex: 1 0 100%; justify-content: space-between; border-top: 1px solid var(--ink); padding-top: 3px; }
.rw[data-mode="narrow"] .opts select { max-width: 200px; flex: 1 1 auto; }

.rw .shell { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; }
.rw .view { position: absolute; inset: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }

/* ---------- the series menu: a TOP SHEET under the bar ---------- */
.rw .menu { position: absolute; z-index: 30; left: 0; right: 0; top: 0; max-height: 100%; overflow: auto; padding: 14px 18px 12px; background: var(--grain), var(--paper3); border-bottom: 6px double var(--ink); box-shadow: 0 9px 0 rgba(27, 23, 19, .22); transform: translateY(-104%); visibility: hidden; transition: transform .3s ease, visibility 0s linear .3s; }
.rw[data-menu="open"] .menu { transform: none; visibility: visible; transition: transform .3s ease; }
.rw .scrim-m { position: absolute; inset: 0; z-index: 20; background: rgba(27, 23, 19, .46); }
.rw .menu-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding-bottom: 6px; margin-bottom: 16px; border-bottom: 3px solid var(--ink); font: 900 28px/1 var(--serif); text-transform: uppercase; letter-spacing: -.02em; }
.rw .menu-h::after { content: "Press a card to show or hide a series."; font: italic 400 14px var(--serif); text-transform: none; letter-spacing: 0; color: var(--ink2); }
.rw .menu ul { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px 14px; }
.rw[data-mode="narrow"] .menu { padding: 10px 10px 10px; }
.rw[data-mode="narrow"] .menu-h { font-size: 24px; margin-bottom: 14px; }
.rw[data-mode="narrow"] .menu ul { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 10px; }
.rw .si { position: relative; display: flex; flex-direction: column; background: var(--paper); border: 1.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.rw .si::before { content: ""; position: absolute; left: 10px; top: -9px; width: 34px; height: 11px; background: var(--c); border: 1.5px solid var(--ink); }
.rw .si > button { display: flex; flex-direction: column; gap: 8px; width: 100%; flex: 1 1 auto; padding: 14px 10px 10px; text-align: left; }
.rw .si > button:hover .nm { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.rw .si .nm { display: block; font: 800 18px/1.1 var(--serif); letter-spacing: -.01em; }
.rw .si .tg { position: absolute; right: 6px; top: 6px; padding: 1px 6px 0; border: 2px solid var(--red); color: var(--red); font: 800 11px/1.3 var(--serif); letter-spacing: .14em; text-transform: uppercase; transform: rotate(7deg); background: rgba(248, 242, 227, .85); }
.rw .si.off { background: repeating-linear-gradient(135deg, rgba(27, 23, 19, .07) 0 2px, transparent 2px 7px), var(--paper2); box-shadow: 3px 3px 0 var(--hair); }
.rw .si.off .car { opacity: .5; }
.rw .si.off .nm { color: var(--ink2); }
.rw .si.off .tg { color: var(--ink2); border-color: var(--ink2); border-style: dashed; }
.rw .si .cw { margin-top: 6px; }
.rw .cls { display: flex; gap: 6px; padding: 0 10px 10px; }
.rw .cls button { flex: 1 1 0; min-height: 40px; padding: 0 4px; border: 1.5px solid var(--ink); font: 700 13px var(--serif); text-align: center; background: var(--paper3); }
.rw .cls button.on { background: var(--ink); color: var(--paper3); }
.rw .sn { padding: 0 10px 10px; font: italic 12px/1.3 var(--serif); color: var(--ink2); }
.rw .menu-f { margin-top: 16px; padding-top: 8px; border-top: 1px solid var(--ink); font: italic 12.5px/1.4 var(--serif); color: var(--ink2); }

/* ---------- car drawings: ink line drawings with a misregistered colour block ---------- */
.rw .car-pair { display: flex; flex-direction: column; gap: 0; }
.rw .car-pair .car + .car { margin-top: -6px; }
.rw .car { display: block; width: 100%; height: auto; overflow: visible; }
.rw .car * { fill: var(--paper3) !important; stroke: var(--ink) !important; stroke-width: 1.5px !important; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: 1 !important; }
.rw .car > ellipse:first-child, .rw .car g { display: none !important; }
.rw .car circle[r="11"], .rw .car circle[r="12"], .rw .car circle[r="14"] { fill: var(--ink) !important; }
.rw .car text { fill: var(--ink) !important; stroke: none !important; font-family: var(--serif); }
.rw .cw { position: relative; display: block; }
.rw .cw::after { content: ""; position: absolute; left: 12%; right: 12%; top: 32%; bottom: 16%; background: var(--c, transparent); opacity: .5; mix-blend-mode: multiply; transform: translate(2px, 3px) skewX(-8deg); pointer-events: none; z-index: 2; }
.rw .cw > svg, .rw .cw > .car-pair { position: relative; z-index: 1; }

/* ---------- series code, session rows, results: a typeset programme ---------- */
.rw .sl { margin: 0; padding: 0; }
.rw .sr { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; padding: 2px 0; font-size: 12px; line-height: 1.25; }
.rw .sr .sc { flex: none; padding: 0 3px 0 5px; border-left: 5px solid var(--c); font: 800 9.5px/1.3 var(--serif); letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
.rw .sr .tm { flex: none; font-weight: 700; font-variant-numeric: tabular-nums lining-nums; letter-spacing: .01em; }
.rw .sr .tm small { font-weight: 400; font-style: italic; color: var(--ink2); }
.rw .sr .nm { flex: 1 1 5.5em; min-width: 0; }
.rw .sr .nm i { font-style: italic; color: var(--ink2); }
.rw .sr .stt { font-style: italic; color: var(--ink2); }
.rw .sr.k-race .nm { font-weight: 800; }
.rw .sr.k-race .tm { color: var(--red); }
.rw .sr.k-sprint .nm { font-weight: 700; }
.rw .sr.st-live .stt { color: var(--red); font-weight: 700; }
.rw .rb { flex: none; margin-left: auto; font: italic 700 1em var(--serif); }
.rw button.rb { position: relative; padding: 0; color: var(--blue); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.rw button.rb::after { content: ""; position: absolute; left: 0; right: 0; top: -11px; bottom: -11px; }
.rw button.rb:hover { color: var(--red); }
.rw button.rb.prov { text-decoration-style: dashed; }
.rw span.rb.pending { color: var(--ink2); font-weight: 400; }
.rw span.rb.live { padding: 0 5px; border: 2px solid var(--red); color: var(--red); font: 800 .8em var(--serif); letter-spacing: .14em; text-transform: uppercase; transform: rotate(-3deg); }
.rw .more { padding-top: 2px; }
.rw .more button { color: var(--blue); font: italic 700 12px var(--serif); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- month, wide: poster tiles ---------- */
.rw .month { min-height: 100%; display: flex; flex-direction: column; }
.rw .dow { position: sticky; top: 0; z-index: 6; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--paper); border-bottom: 3px double var(--ink); }
.rw .dow span { padding: 5px 9px 3px; font: italic 700 14px var(--serif); font-variant: small-caps; letter-spacing: .16em; }
.rw .grid { flex: 1 1 auto; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(92px, auto); border-left: 1px solid var(--ink); }
.rw .grid .cell { position: relative; min-width: 0; border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.rw .grid .cell:not(.ev) { padding: 6px 8px; }
.rw .cell:not(.ev) .dn { font: italic 400 17px/1 var(--serif); color: var(--ink2); }
.rw .cell.out { background: repeating-linear-gradient(135deg, rgba(27, 23, 19, .075) 0 2px, transparent 2px 7px); }
.rw .cell.out .dn { opacity: .5; }
.rw .cell:not(.ev).today .dn { display: inline-block; padding: 1px 7px 0; background: var(--red); color: var(--paper3); font-style: normal; font-weight: 700; }
.rw .cell.ev { position: relative; display: flex; flex-direction: column; min-height: 258px; padding: 9px 8px 0; background: var(--paper2); border-right: 0; border-bottom: 0; cursor: pointer; overflow: hidden; }
.rw .cell.ev::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--ink); pointer-events: none; z-index: 4; }
.rw .cell.ev.today::after { border: 4px solid var(--red); }
.rw .cell.ev:hover .loc b, .rw .cell.ev:focus-visible .loc b { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 3px; text-underline-offset: 3px; }
.rw .cell.ev:focus-visible { outline: 3px solid var(--blue); outline-offset: -5px; }
