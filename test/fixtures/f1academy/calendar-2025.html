hly competitive season saw eight different winners with Pin, Maya Weug and Chloe Chambers all vying for the title in their sophomore campaign. Achieving four wins and a further four podium finishes, nobody could stop the Frenchwoman claiming the ultimate glory in the final race of the season - and completing a remarkable run of points-scoring finishes stretching across every race of her F1 ACADEMY career.\n\nDoing the double for the second time, PREMA Racing reigned supreme in the Teams’ battle, successfully retaining title for the third consecutive season over rivals Campos Racing and MP Motorsport."},"cacheControl":"public,max-age=0"},"seasonData":[{"SeasonId":4,"SeasonName":"2026 F1 Academy","SeasonStartDate":"2026-01-01","SeasonEndDate":"2026-12-31","SeasonTypeCode":"MAIN","HasResultFeed":true},{"SeasonId":3,"SeasonName":"2025 F1 Academy","SeasonStartDate":"2025-01-01","SeasonEndDate":"2025-12-30","SeasonTypeCode":"MAIN","HasResultFeed":true},{"SeasonId":2,"SeasonName":"2024 F1 Academy","SeasonStartDate":"2024-01-01","SeasonEndDate":"2024-12-31","SeasonTypeCode":"MAIN","HasResultFeed":true},{"SeasonId":1,"SeasonName":"2023 F1 Academy","SeasonStartDate":"2023-01-01","SeasonEndDate":"2023-12-31","SeasonTypeCode":"MAIN","HasResultFeed":true}],"eventTrackerData":{"State":"OFF","cacheControl":"public,max-age=0"},"statusCode":200,"seasonid":"3","asPath":"/Racing-Series/Calendar?seasonid=3","pathname":"/Racing-Series/Calendar"},"rootRouter":{"route":"/Racing-Series/Calendar","pathname":"/Racing-Series/Calendar","query":{"seasonid":"3"},"asPath":"/Racing-Series/Calendar?seasonid=3","isFallback":false}},"page":"/Racing-Series/Calendar","query":{"seasonid":"3"},"buildId":"2hRee9W1sNnj70bAugc3B","runtimeConfig":{},"isFallback":false}</script></body></html>
